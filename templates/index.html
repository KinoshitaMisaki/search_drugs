<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataBase Search v1.0</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>DataBase Search v1.0</h1>
    </header>

    <main>
        <div class="search-container">
            <form id="search-form">
                <div class="form-group">
                    <label for="product_name">品名:</label>
                    <input type="text" id="product_name" name="product_name">
                </div>
                <div class="form-group">
                    <label for="manufacturer">メーカー名:</label>
                    <input type="text" id="manufacturer" name="manufacturer">
                </div>
                <div class="form-group">
                    <label for="model_number">型番:</label>
                    <input type="text" id="model_number" name="model_number">
                </div>
                 <button type="submit">検索</button>
            </form>
        </div>

        <div class="result-container">
            <div class="result-info">
                <span id="search-count">検索件数: 0 件</span>
                <button id="export-csv">csvに出力</button>
            </div>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>製品名(和)</th>
                        <th>製品名(英)</th>
                        <th>型番</th>
                        <th>メーカー</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Search results will be inserted here -->
                </tbody>
            </table>
            <p id="no-results-message" style="display: none;">該当する製品が見つかりませんでした。</p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
